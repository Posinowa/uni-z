flutter_launcher_icons:
  # Android launcher icon
  android: true
  # iOS launcher icon
  ios: true

  # Kaynak görsel — minimum 1024x1024 önerilir
  image_path: "assets/images/app_icon.png"

  # Android'de adaptive icon desteği (API 26+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  # Web (opsiyonel, ileride kullanılabilir)
  web:
    generate: false

  # Windows (opsiyonel, ileride kullanılabilir)
  windows:
    generate: false
